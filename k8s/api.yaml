apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: llm-logger
data:
  DATABASE_URL: "postgresql+asyncpg://app:app@postgres:5432/llm_db"
  REDIS_URL: "redis://redis:6379"
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  MAX_CONVERSATION_HISTORY: "20"
  REDIS_STREAM_NAME: "inference_logs"
  REDIS_STREAM_MAXLEN: "100000"
  INGESTION_CONSUMER_GROUP: "ingestion"
  INGESTION_RETRY_AFTER_MS: "30000"
  # Update to match your frontend domain
  CORS_ORIGINS: '["http://app.example.com"]'
---
# Populate your API keys before applying.
# kubectl create secret generic api-keys -n llm-logger \
#   --from-literal=ANTHROPIC_API_KEY=sk-ant-... \
#   --from-literal=OPENAI_API_KEY=sk-... \
#   --from-literal=GEMINI_API_KEY=...
apiVersion: v1
kind: Secret
metadata:
  name: api-keys
  namespace: llm-logger
type: Opaque
stringData:
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""
  GEMINI_API_KEY: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: llm-logger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          # docker build -t your-registry/llm-logger-api:latest .
          # docker push your-registry/llm-logger-api:latest
          image: your-registry/llm-logger-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-keys
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: llm-logger
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
